name: Update AUR package

# 定时检查上游 APT 仓库，发现新版本后更新 PKGBUILD/.SRCINFO 并推送到 AUR。
#
# 需要的仓库 Secret:
#   AUR_SSH_PRIVATE_KEY  已添加到 AUR 账户 SSH Public Key 的私钥（无口令）
#
# 说明:
#   - 上游版本与 SHA-256 取自 https://download.gotempest.app/apt 的 Packages 索引，
#     与仓库里的 .nvchecker.toml 使用同一数据源。
#   - 更新后在 Arch 容器中重新生成 .SRCINFO，并分别构建 x86_64 / aarch64 包；
#     任何一步失败都不会提交或推送。
#   - 构建通过后同时推送到 AUR 和当前 GitHub 仓库，保持镜像同步。

on:
  schedule:
    # 每 6 小时检查一次（UTC，GitHub 可能会延迟执行）
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只检查并生成 diff，不提交、不推送"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aur-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PKGNAME: tempest-cli-bin
      AUR_BRANCH: master
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect upstream release and update PKGBUILD
        id: upstream
        run: bash .github/scripts/update-pkgbuild.sh

      - name: Verify build and regenerate .SRCINFO
        if: steps.upstream.outputs.updated == 'true'
        run: |
          set -euo pipefail
          # makepkg 不允许以 root 运行，因此用 runner 的 uid/gid 在容器内执行。
          # 容器内没有该 uid 的 passwd 条目也没关系，makepkg 可以正常工作。
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/pkg" \
            -w /pkg \
            archlinux:base-devel \
            bash -c '
              set -euo pipefail
              makepkg --printsrcinfo > .SRCINFO
              makepkg -f --noconfirm
              CARCH=aarch64 makepkg -f --noconfirm
            '
          grep -Fq "pkgver = ${{ steps.upstream.outputs.pkgver }}" .SRCINFO

      - name: Show diff (dry run)
        if: steps.upstream.outputs.updated == 'true' && inputs.dry_run
        run: |
          git diff -- PKGBUILD .SRCINFO

      - name: Commit changes
        if: steps.upstream.outputs.updated == 'true' && inputs.dry_run != true
        env:
          GIT_AUTHOR_NAME: Ganyu_Genshin
          GIT_AUTHOR_EMAIL: XianYuPigeon@outlook.com
          GIT_COMMITTER_NAME: Ganyu_Genshin
          GIT_COMMITTER_EMAIL: XianYuPigeon@outlook.com
        run: |
          set -euo pipefail
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "upgpkg: ${PKGNAME} ${{ steps.upstream.outputs.pkgver }}-1"
          fi

      - name: Configure AUR SSH
        if: steps.upstream.outputs.updated == 'true' && inputs.dry_run != true
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret AUR_SSH_PRIVATE_KEY is not set"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # 固定 AUR 的 ed25519 主机公钥，避免 ssh-keyscan 被中间人替换。
          cat > ~/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          chmod 600 ~/.ssh/known_hosts

      - name: Push to AUR
        if: steps.upstream.outputs.updated == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519"
          git remote add aur "ssh://aur@aur.archlinux.org/${PKGNAME}.git" 2>/dev/null ||
            git remote set-url aur "ssh://aur@aur.archlinux.org/${PKGNAME}.git"
          git fetch --no-tags aur "+refs/heads/${AUR_BRANCH}:refs/remotes/aur/${AUR_BRANCH}"
          if [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "refs/remotes/aur/${AUR_BRANCH}^{tree}")" ]; then
            # AUR 已经是同样内容（例如上一次 AUR 推送成功但 GitHub 回推失败）。
            # 对齐到 AUR 的提交，避免两边历史无谓分叉。
            echo "AUR already contains this tree; aligning local HEAD with AUR"
            git reset --hard "refs/remotes/aur/${AUR_BRANCH}"
          else
            git push aur "HEAD:${AUR_BRANCH}"
          fi

      - name: Push mirror to GitHub
        if: steps.upstream.outputs.updated == 'true' && inputs.dry_run != true
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
